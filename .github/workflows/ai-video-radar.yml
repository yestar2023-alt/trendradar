name: AI Video URL Delta Radar

on:
  schedule:
    # Beijing 07:00 = previous-day UTC 23:00. GitHub may delay scheduled runs.
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'ai-video-radar/radar.py'
      - 'ai-video-radar/seo_metrics.py'
      - 'ai-video-radar/data/keyword_metrics.csv'
      - 'ai-video-radar/config.json'
      - 'ai-video-radar/tests/**'
      - '.github/workflows/ai-video-radar.yml'

permissions:
  contents: write

concurrency:
  group: ai-video-radar-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect location and run tests
        id: locate
        shell: bash
        run: |
          if test -f ai-video-radar/radar.py; then echo "root=ai-video-radar" >> "$GITHUB_OUTPUT"; else echo "root=." >> "$GITHUB_OUTPUT"; fi
          python -m unittest discover -s "$(test -f ai-video-radar/radar.py && echo ai-video-radar/tests || echo tests)" -v
      - name: Crawl and compare snapshots
        env:
          SEO_AUTO_FETCH: ${{ vars.SEO_AUTO_FETCH }}
          SEO_FETCH_INTITLE: ${{ vars.SEO_FETCH_INTITLE }}
          SEO_ESTIMATE_BACKLINKS_FROM_KD: ${{ vars.SEO_ESTIMATE_BACKLINKS_FROM_KD }}
          SEO_MAX_KEYWORDS_PER_RUN: ${{ vars.SEO_MAX_KEYWORDS_PER_RUN }}
          SEO_LOCATION: ${{ vars.SEO_LOCATION }}
          SEO_LANGUAGE: ${{ vars.SEO_LANGUAGE }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python "${{ steps.locate.outputs.root }}/radar.py" --root "${{ steps.locate.outputs.root }}"
      - name: Persist daily snapshot and report in Git
        shell: bash
        env:
          RADAR_ROOT: ${{ steps.locate.outputs.root }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RADAR_ROOT/data" "$RADAR_ROOT/reports"
          if ! git diff --cached --quiet; then
            git commit -m "radar: snapshot and report $(TZ=Asia/Shanghai date +%F)"
            # A code/CSV push may happen during the scan. Never force-push the snapshot.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-radar-${{ github.run_id }}
          path: |
            ${{ steps.locate.outputs.root }}/reports/latest.md
            ${{ steps.locate.outputs.root }}/reports/*.csv
          if-no-files-found: ignore
          retention-days: 30